        <title>Registration - SBM Furnitures</title>
        <style>
            body{
                background-image: url("Registration B.webp"); 
                background-size: cover;
                    background-position: center;
                background-repeat: no-repeat;       
                margin: 0;
                padding: 0;
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;
               
            }
            .registration-form {
                margin-top: 100px;
                background-color:rgb(229, 194, 152);
                padding: 20px;
                border-radius: 8px;
                max-width: 400px;
                margin: 50px auto;
            }
            .registration-form input {
                width: 100%;
                padding: 10px;
                margin: 10px 0;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            .registration-form button {
                width: 100%;
                padding: 10px;
                background-color: #4CAF50;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }
            .registration-form button:hover {
                background-color: #45a049;
            }
        </style>
